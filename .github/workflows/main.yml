name: Image Recognition CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (MediaPipe / OpenCV)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgl1 \
          libglib2.0-0 \
          libgles2 \
          libegl1 \
          libopengl0 \
          libsm6 \
          libxext6 \
          libxrender1

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
        # Ensure test-time tooling and cv2 are available even if requirements changes.
        python -m pip install flake8 pytest opencv-python

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Unit Tests
      run: |
        # Tests live under .github/test; pytest skips dot-directories by default
        pytest .github/test

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: monkey-recognition-app
        path: |
          app.py
          hand_landmarker.task
          Monkey/

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        name: monkey-recognition-app

    - name: Deploy to Production
      run: |
        echo "Deploying to production server..."
        # Add your specific deployment commands here (e.g., Docker push, AWS S3 sync, etc.)
